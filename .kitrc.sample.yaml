# Copy this file to `.kitrc` at the repo root and adjust the paths for your environment.
# Values in this file act as defaults for the CLI and can still be overridden per command.

stamp:
  input: Kit.Updater/bin/Release/net48/Kit.Updater.exe
  config: stamp-config.sample.json
  output: artifacts/MyApp-Updater.exe

inspect:
  input: artifacts/MyApp-Updater.exe

manifest:
  version: 1.1.0
  updater: artifacts/MyApp-Updater.exe
  package: artifacts/MyApp-1.1.0.zip
  installer: artifacts/MyApp-1.1.0-Setup.exe
  output: artifacts
  updaterUpdateRequired: false

release:
  appDir: publish/MyApp
  config: stamp-config.sample.json
  updater: Kit.Updater/bin/Release/net48/Kit.Updater.exe
  outputDir: artifacts
  packageName: MyApp.zip
  installerCommand: iscc.exe
  installerArgs: .\installer.iss /DAppVersion={Version} /DOutputDir={OutputDir}
  installerPath: '{OutputDir}\MyApp-Setup.exe'
